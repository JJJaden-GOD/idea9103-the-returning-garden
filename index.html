<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050610">
  <title>The Returning Garden</title>
  <!-- Oxanium is local; its original OFL and source notice are in assets/fonts. -->
  <link rel="preload" href="assets/fonts/Oxanium-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="garden-page">
    <header class="page-heading">
      <h1>The Returning Garden</h1>
    </header>

    <section class="artwork" aria-label="An interactive garden moving between Paradise, Earth, Hell and Return">
      <div class="stage-caption">
        <span id="phase-number">01</span>
        <span id="phase-name" aria-live="polite">PARADISE</span>
        <span id="paused-label" hidden>PAUSED</span>
      </div>
      <div id="canvas-host"></div>
    </section>

    <section class="experience-controls" aria-label="Garden controls">
      <div class="journey">
        <div class="journey-track" id="cycle-track" role="progressbar" aria-label="Position in the 60 second world cycle" aria-valuemin="0" aria-valuemax="60" aria-valuenow="0">
          <span id="cycle-progress"></span>
        </div>
        <div class="journey-labels" aria-hidden="true">
          <span class="current">Paradise</span><span>Earth</span><span>Hell</span><span>Return</span>
        </div>
      </div>
      <div class="buttons">
        <button id="enter-button" class="primary" type="button">Enter garden <span aria-hidden="true">↗</span></button>
        <button id="sound-button" type="button" aria-pressed="false">Enable sound</button>
        <button id="pause-button" type="button" aria-pressed="false" disabled>Pause cycle</button>
      </div>
    </section>

    <p class="audio-note" id="audio-note" aria-live="polite" hidden></p>
    <noscript>This artwork needs JavaScript. Please enable JavaScript and open index.html through a local web server.</noscript>
  </main>

  <!-- The local library copies make the artwork independent of a live CDN. -->
  <script src="libraries/p5.min.js"></script>
  <script src="libraries/p5.sound.min.js"></script>
  <!-- Ordinary script loading follows the classroom project structure. -->
  <script src="castle.js"></script>
  <script src="time-mechanic.js"></script>
  <script src="noise-mechanic.js"></script>
  <script src="audio-mechanic.js"></script>
  <script src="input-mechanic.js"></script>
  <script src="world-details.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
