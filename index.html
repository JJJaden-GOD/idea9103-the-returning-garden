<!DOCTYPE html>
<!-- AI assistance: ChatGPT and Codex helped structure this page and its accessible controls. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050610">
  <title>The Returning Garden</title>
  <!-- Oxanium is local; its original OFL and source notice are in assets/fonts. -->
  <link rel="preload" href="assets/fonts/Oxanium-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="garden-page">
    <header class="page-heading">
      <h1>The Returning Garden</h1>
    </header>

    <div class="garden-stage">
      <div class="stage-spacer" aria-hidden="true"></div>
      <section class="artwork" aria-label="An interactive garden moving between Paradise, Earth, Hell and Return">
        <div id="canvas-host"></div>
      </section>
      <aside class="control-sidebar" aria-label="Garden controls">
        <div class="buttons">
          <!-- AI assistance: Codex helped draw these local SVG controls.
               Button names remain available on hover and to assistive tools.
               Path reference: https://developer.mozilla.org/en-US/docs/Web/SVG/Element/path -->
          <button id="enter-button" class="primary" type="button" aria-label="Enter garden" title="Enter garden">
            <svg class="icon-restart" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.5 10a7.7 7.7 0 1 0-.9 6.2M19.5 4.5V10H14"/></svg>
          </button>
          <div class="sound-control">
            <button id="sound-button" type="button" aria-label="Turn sound on" title="Turn sound on" aria-pressed="false">
              <svg class="icon-sound-on" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 5 6.5 9H3v6h3.5l4.5 4ZM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg>
              <svg class="icon-sound-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 5 6.5 9H3v6h3.5l4.5 4Zm5 4 5 6m0-6-5 6"/></svg>
            </button>
            <div id="volume-control" class="volume-control"></div>
          </div>
          <button id="pause-button" type="button" aria-label="Pause garden" title="Pause garden" aria-pressed="false" disabled>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14M16 5v14"/></svg>
            <svg class="icon-resume" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="solid-icon" d="M8 5.5 19 12 8 18.5Z"/></svg>
          </button>
        </div>
      </aside>
    </div>

    <section class="journey" aria-label="World cycle">
      <div class="journey-track" id="cycle-track" role="progressbar" aria-label="Position in the 60 second world cycle" aria-valuemin="0" aria-valuemax="60" aria-valuenow="0">
        <span id="cycle-progress"></span>
      </div>
      <div class="journey-labels" aria-hidden="true">
        <span class="current">Paradise</span><span>Earth</span><span>Hell</span><span>Return</span>
      </div>
    </section>

    <p class="audio-note" id="audio-note" aria-live="polite" hidden></p>
    <noscript>This artwork needs JavaScript. Please enable JavaScript and open index.html through a local web server.</noscript>
  </main>

  <!-- The local library copies make the artwork independent of a live CDN. -->
  <script src="libraries/p5.min.js"></script>
  <script src="libraries/p5.sound.min.js"></script>
  <!-- Ordinary script loading follows the classroom project structure. -->
  <script src="castle.js"></script>
  <script src="time-mechanic.js"></script>
  <script src="noise-mechanic.js"></script>
  <script src="audio-mechanic.js"></script>
  <script src="input-mechanic.js"></script>
  <script src="world-details.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
